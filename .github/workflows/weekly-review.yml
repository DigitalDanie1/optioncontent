name: Weekly options review - cloud recovery
on:
  schedule:
    - cron: '0 10 * * 0'
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      operation:
        description: Prepare assets, deliver ready draft, or recover both
        type: choice
        options: [prepare, deliver, recover]
        default: prepare
permissions:
  contents: write
concurrency:
  group: telegram-channel-publisher
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Select operation
        id: operation
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT: ${{ inputs.operation }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "value=$INPUT" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = '0 10 * * 0' ]; then
            echo 'value=prepare' >> "$GITHUB_OUTPUT"
          else
            echo 'value=deliver' >> "$GITHUB_OUTPUT"
          fi
      - name: Decide whether preparation is needed
        id: prepare
        env:
          OPERATION: ${{ steps.operation.outputs.value }}
        run: |
          if [ "$OPERATION" = prepare ] || [ "$OPERATION" = recover ]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          elif node scripts/check-weekly-ready.mjs; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install preparation tools
        if: steps.prepare.outputs.needed == 'true'
        run: |
          npm ci --ignore-scripts
          python -m pip install beautifulsoup4==4.13.4
          npx playwright install --with-deps chromium
      - name: Prepare fresh source-backed review
        if: steps.prepare.outputs.needed == 'true'
        run: |
          python scripts/prepare-weekly.py
          node scripts/render-weekly.mjs
          python scripts/check.py
          python scripts/update-calendar-status.py prepared
          node --test scripts/telegram-publish.test.mjs
      - name: Commit prepared assets
        if: steps.prepare.outputs.needed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html studio.html studio-W42.html scripts/current-ko.html scripts/current-en.html assets/weekly sources/weekly publish/telegram.json publish/weekly-build.json publish/weekly-ready.json
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare verified weekly options review'
            git push origin HEAD:main
          fi
      - name: Validate delivery date and exact assets
        if: steps.operation.outputs.value != 'prepare'
        run: node scripts/check-weekly-ready.mjs
      - name: Prepare persistent delivery receipts
        if: steps.operation.outputs.value != 'prepare'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin telegram-state
          git worktree add --detach "$RUNNER_TEMP/telegram-state" FETCH_HEAD
      - name: Send only to owner private bot chat
        if: steps.operation.outputs.value != 'prepare'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_STATE_DIR: ${{ runner.temp }}/telegram-state
        run: node scripts/telegram-publish.mjs draft
      - name: Record private delivery on calendar
        if: steps.operation.outputs.value != 'prepare'
        run: |
          python scripts/update-calendar-status.py delivered
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Record successful private weekly delivery'
            git push origin HEAD:main
          fi
      - name: Report failure privately
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram-failure-alert.mjs
